---
name: damm-v2-fee-routing
id: damm-v2-fee-routing
runbooks:
  - name: deployment
    description: Deploy programs
    location: runbooks/deployment
  - name: init
    description: initialize honorary position
    location: runbooks/initialize-honorary-position
environments:
  localnet:
      network_id: localnet
      rpc_api_url: http://127.0.0.1:8899
  devnet:
      network_id: devnet
      rpc_api_url: https://api.devnet.solana.com
      payer_keypair_json: ~/.config/solana/id.json
      authority_keypair_json: ~/.config/solana/id.json
  surfnet:
      network_id: surfnet
      rpc_api_url: https://slaws-share-loss.txtx.network:8899
      payer_keypair_json: ~/.config/solana/id.json
      authority_keypair_json: ~/.config/solana/id.json

