[package]
name = "damm-v2-fee-routing"
version = "0.1.0"
description = "Permissionless Fee Routing for Meteora DAMM V2"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "damm_v2_fee_routing"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Use workspace versions
anchor-lang = { workspace = true, features = ["event-cpi"] }
anchor-spl = { workspace = true }

# Use workspace cp-amm
cp-amm = { workspace = true }
